server.port=9090

spring.application.name=Blog_Application

#db-configuration
spring.datasource.url=jdbc:mysql://localhost:3306/blog_app_apis

spring.datasource.username={username}
spring.datasource.password={password}

!spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

#create - prv destory then create, update - necessary then create, create-drop - create then drop when session end, validate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

gemini.api.key=${API_KEY}
gemini.api.base-url=https://generativelanguage.googleapis.com/v1beta
#gemini.api.model=gemini-flash-latest
gemini.api.model=gemini-3.5-flash-lite
nvidia.api.mock-mode=false

